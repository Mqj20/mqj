<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MQJ LIVE</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}
:root{--bg:#070b12;--card:#101722;--border:rgba(255,255,255,.09);--blue:#19a7ff;--blue2:#087bd0;--text:#fff;--muted:#8e9aaa;--green:#20d68a;--red:#ff4d5f}
body{background:radial-gradient(circle at top,#10243a 0,#070b12 45%);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:1000;background:rgba(7,11,18,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:13px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:23px;font-weight:900}.logo span{color:var(--blue)}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:#777}.status-dot.online{background:var(--green);box-shadow:0 0 12px var(--green)}.status-dot.error{background:var(--red)}
.settings,.player-area,.controls,.categories,.main{max-width:1100px;margin-left:auto;margin-right:auto}
.settings{margin-top:15px;padding:14px;background:rgba(16,23,34,.88);border:1px solid var(--border);border-radius:15px}
.settings-title{font-size:15px;font-weight:800;margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:8px}
input{width:100%;border:1px solid var(--border);outline:none;background:#0b111b;color:white;border-radius:10px;padding:12px;font-size:14px}
input:focus{border-color:var(--blue)}
.connect-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:10px;padding:0 18px;font-weight:800;white-space:nowrap;border:0;cursor:pointer}
.message{margin-top:10px;font-size:13px;color:var(--muted);min-height:18px}
.player-area{padding:0 13px;margin-top:15px}
.player{position:relative;width:100%;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 15px 45px rgba(0,0,0,.5)}
video{width:100%;aspect-ratio:16/9;display:block;background:#000}
.now-playing{padding:11px 13px;background:#0e151f;display:flex;align-items:center;justify-content:space-between;gap:10px}
.now-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.live{color:#ff5364;font-size:11px;font-weight:900}
.controls{padding:0 13px;margin-top:15px}.search{position:relative}.search input{padding-right:43px;background:#0e151f}.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.categories{padding:0 13px;margin-top:12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;background:#111a27;border:1px solid var(--border);color:#dce5ef;border-radius:30px;padding:9px 14px;font-size:12px;cursor:pointer}.cat.active{background:var(--blue);color:white;border-color:var(--blue)}
.main{padding:0 13px 40px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.section-head h2{font-size:16px}.count{color:var(--muted);font-size:12px}
.channels{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.channel{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--border);border-radius:13px;padding:11px;display:flex;align-items:center;gap:10px;min-height:68px;transition:.18s;cursor:pointer}
.channel:active{transform:scale(.98)}.channel-logo{width:43px;height:43px;border-radius:10px;background:#0a1018;object-fit:contain;flex-shrink:0}.channel-info{min-width:0;flex:1}
.channel-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel-group{color:var(--muted);font-size:10px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-btn{width:34px;height:34px;border-radius:50%;background:#142638;color:#fff;flex-shrink:0;border:0;cursor:pointer}.play-btn:hover{background:var(--blue)}
.empty{text-align:center;padding:45px 20px;color:var(--muted);display:none}.empty-icon{font-size:40px;margin-bottom:10px}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.loader-box{background:#101722;border:1px solid var(--border);border-radius:16px;padding:25px 30px;text-align:center}.spinner{width:38px;height:38px;border:4px solid #263242;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.form-grid{grid-template-columns:1fr 1fr}.form-grid input:first-child{grid-column:1/-1}.connect-btn{height:45px;grid-column:1/-1}}
@media(max-width:450px){.channels{grid-template-columns:1fr}.logo{font-size:20px}}
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="logo">MQJ <span>LIVE</span></div>
    <div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText">غير متصل</span></div>
  </div>
</header>

<section class="settings">
  <div class="settings-title">⚙️ اتصال IPTV</div>
  <div class="form-grid">
    <input id="server" type="text" placeholder="Server">
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button class="connect-btn" onclick="connectIPTV()">🔌 اتصال وتحميل القنوات</button>
  </div>
  <div id="message" class="message">بيانات الحساب محفوظة في هذا الجهاز فقط.</div>
</section>

<section class="player-area">
  <div class="player">
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="now-playing">
      <div id="nowPlaying" class="now-name">لم يتم اختيار قناة</div>
      <div class="live">● LIVE</div>
    </div>
  </div>
</section>

<div class="controls">
  <div class="search">
    <span class="search-icon">🔎</span>
    <input id="search" type="search" placeholder="ابحث عن قناة..." oninput="renderChannels()">
  </div>
</div>

<div id="categories" class="categories"></div>

<main class="main">
  <div class="section-head">
    <h2>📺 القنوات</h2>
    <span id="count" class="count">0 قناة</span>
  </div>
  <div id="channels" class="channels"></div>
  <div id="empty" class="empty"><div class="empty-icon">📡</div><div>لا توجد قنوات مطابقة للبحث.</div></div>
</main>

<div id="loading" class="loading">
  <div class="loader-box">
    <div class="spinner"></div>
    <div id="loadingText">جاري الاتصال...</div>
  </div>
</div>

<script>
const IPTV = {
  server: "http://pro.prince4k.com:7355",
  username: "PR2745575399204",
  password: "3508140413704"
};

let channels=[];
let currentCategory="ALL";
let hls=null;

const video=document.getElementById("video");
const message=document.getElementById("message");
const statusDot=document.getElementById("statusDot");
const statusText=document.getElementById("statusText");
const channelsBox=document.getElementById("channels");
const countBox=document.getElementById("count");
const emptyBox=document.getElementById("empty");
const nowPlaying=document.getElementById("nowPlaying");
const categoriesBox=document.getElementById("categories");

document.getElementById("server").value=IPTV.server;
document.getElementById("username").value=IPTV.username;
document.getElementById("password").value=IPTV.password;

function setMessage(text,type="normal"){
  message.textContent=text;
  message.style.color=type==="success"?"#20d68a":type==="error"?"#ff5364":"#8e9aaa";
}
function showLoading(text){document.getElementById("loadingText").textContent=text;document.getElementById("loading").style.display="flex"}
function hideLoading(){document.getElementById("loading").style.display="none"}
function setStatus(s){
  statusDot.className="status-dot";
  if(s==="online"){statusDot.classList.add("online");statusText.textContent="متصل"}
  else if(s==="error"){statusDot.classList.add("error");statusText.textContent="فشل الاتصال"}
  else statusText.textContent="غير متصل";
}
function normalizeServer(s){return s.trim().replace(/\/+$/,"")}

async function connectIPTV(){
  const server=normalizeServer(document.getElementById("server").value);
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!server||!username||!password){
    setMessage("❌ أكمل بيانات السيرفر والحساب.","error");return;
  }

  const playlistURL=server+"/get.php?username="+encodeURIComponent(username)+"&password="+encodeURIComponent(password)+"&type=m3u_plus";
  showLoading("جاري تحميل قائمة القنوات...");
  setMessage("جاري الاتصال بالسيرفر...");
  setStatus("");

  try{
    const response=await fetch(playlistURL,{method:"GET",cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const text=await response.text();

    if(!text||!text.includes("#EXTM3U")) throw new Error("لم يتم استلام ملف M3U صالح.");

    channels=parseM3U(text);
    if(!channels.length) throw new Error("القائمة وصلت لكن بدون قنوات.");

    localStorage.setItem("mqj_server",server);
    localStorage.setItem("mqj_username",username);
    localStorage.setItem("mqj_password",password);

    setStatus("online");
    setMessage("✅ تم الاتصال وتحميل "+channels.length+" قناة.","success");
    buildCategories();
    renderChannels();

    if(channels[0]) setTimeout(()=>playChannel(channels[0]),300);
  }catch(error){
    console.error(error);
    setStatus("error");
    setMessage("❌ تعذر جلب القائمة. إذا كانت البيانات صحيحة فغالباً السيرفر يمنع CORS من GitHub Pages.","error");
    channels=[];
    renderChannels();
  }finally{hideLoading()}
}

function getAttribute(line,name){
  const m=line.match(new RegExp(name+'="([^"]*)"',"i"));
  return m?m[1]:"";
}

function parseM3U(data){
  const lines=data.split(/\r?\n/);
  const result=[];
  let current=null;

  for(const raw of lines){
    const line=raw.trim();
    if(!line) continue;

    if(line.startsWith("#EXTINF:")){
      const comma=line.indexOf(",");
      current={
        name:comma!==-1?line.substring(comma+1).trim():"قناة",
        group:getAttribute(line,"group-title")||"أخرى",
        logo:getAttribute(line,"tvg-logo")||"",
        id:getAttribute(line,"tvg-id")||"",
        url:""
      };
    }else if(current&&!line.startsWith("#")){
      current.url=line;
      if(current.url) result.push(current);
      current=null;
    }
  }
  return result;
}

function buildCategories(){
  const groups=[...new Set(channels.map(c=>c.group||"أخرى"))].sort((a,b)=>a.localeCompare(b));
  categoriesBox.innerHTML="";

  const all=document.createElement("button");
  all.className="cat active";
  all.textContent="الكل";
  all.onclick=function(){setCategory("ALL",this)};
  categoriesBox.appendChild(all);

  groups.forEach(group=>{
    const btn=document.createElement("button");
    btn.className="cat";
    btn.textContent=group;
    btn.onclick=function(){setCategory(group,this)};
    categoriesBox.appendChild(btn);
  });
}

function setCategory(category,button){
  currentCategory=category;
  document.querySelectorAll(".cat").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  renderChannels();
}

function renderChannels(){
  const search=document.getElementById("search").value.trim().toLowerCase();
  const filtered=channels.filter(ch=>{
    const name=(ch.name||"").toLowerCase();
    const group=(ch.group||"").toLowerCase();
    return (!search||name.includes(search)||group.includes(search))
      &&(currentCategory==="ALL"||ch.group===currentCategory);
  });

  channelsBox.innerHTML="";
  countBox.textContent=filtered.length+" قناة";
  emptyBox.style.display=filtered.length?"none":"block";

  filtered.forEach(channel=>{
    const card=document.createElement("div");
    card.className="channel";

    const img=document.createElement("img");
    img.className="channel-logo";
    img.loading="lazy";
    img.src=channel.logo||"";
    img.onerror=function(){this.style.visibility="hidden"};

    const info=document.createElement("div");
    info.className="channel-info";

    const name=document.createElement("div");
    name.className="channel-name";
    name.textContent=channel.name;

    const group=document.createElement("div");
    group.className="channel-group";
    group.textContent=channel.group;

    info.append(name,group);

    const play=document.createElement("button");
    play.className="play-btn";
    play.textContent="▶";
    play.onclick=e=>{e.stopPropagation();playChannel(channel)};

    card.append(img,info,play);
    card.onclick=()=>playChannel(channel);
    channelsBox.appendChild(card);
  });
}

function playChannel(channel){
  if(!channel||!channel.url)return;

  nowPlaying.textContent=channel.name;

  if(hls){try{hls.destroy()}catch(e){} hls=null}
  video.pause();
  video.removeAttribute("src");

  const url=channel.url.trim();

  if(url.includes(".m3u8")||url.includes("/hls/")||url.includes("/live/")){
    if(Hls.isSupported()){
      hls=new Hls({
        enableWorker:true,
        lowLatencyMode:true,
        backBufferLength:30,
        manifestLoadingTimeOut:15000,
        levelLoadingTimeOut:15000,
        fragLoadingTimeOut:20000
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
      hls.on(Hls.Events.ERROR,(event,data)=>{
        console.warn("HLS",data);
        if(data.fatal)setMessage("⚠️ تعذر تشغيل هذه القناة. قد يكون الرابط منتهيًا أو محميًا.","error");
      });
    }else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src=url;
      video.play().catch(()=>{});
    }
  }else{
    video.src=url;
    video.play().catch(()=>{});
  }
}

window.addEventListener("load",()=>{
  const s=localStorage.getItem("mqj_server");
  const u=localStorage.getItem("mqj_username");
  const p=localStorage.getItem("mqj_password");

  if(s)document.getElementById("server").value=s;
  if(u)document.getElementById("username").value=u;
  if(p)document.getElementById("password").value=p;

  connectIPTV();
});
</script>
</body>
</html>
